spring.application.name=backend

spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS02;databaseName=UniConnectDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=uniconnect_user
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.orm.jpa=DEBUG
logging.level.org.hibernate.boot=DEBUG
logging.level.org.springframework.security=DEBUG

jwt.secret=my-super-secret-key-that-should-be-very-long-and-random-12345678
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB