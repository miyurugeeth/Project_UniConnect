spring:
  application:
    name: uniconnect-backend
  datasource:
    url: "${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=UniConnect;encrypt=true;trustServerCertificate=true}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Development-only placeholder; override FRONTEND_ORIGIN outside local development.
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: "${JWT_SECRET_BASE64:}"
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    issuer: ${JWT_ISSUER:uniconnect-api}

server:
  port: ${SERVER_PORT:8080}
