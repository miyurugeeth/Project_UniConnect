spring:
  application:
    name: uniconnect-backend
  datasource:
    url: "${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=UniConnect_Test;encrypt=true;trustServerCertificate=true}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 150MB

app:
  cors:
    # Development-only placeholder; override FRONTEND_ORIGIN outside local development.
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: "${JWT_SECRET_BASE64:}"
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    issuer: ${JWT_ISSUER:uniconnect-api}
  social:
    media:
      provider: ${SOCIAL_MEDIA_PROVIDER:local}
      storage-dir: ${SOCIAL_MEDIA_STORAGE_DIR:${user.home}/.uniconnect/social-media}
      max-attachments: 5
      max-videos: 1
      max-image-bytes: 10485760
      max-video-bytes: 104857600
      max-image-dimension: 10000
      max-image-pixels: 40000000

server:
  port: ${SERVER_PORT:8080}
